services:
  portfolio:
    build:
      context: .
      target: development
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-5173}:${PORT:-5173}"
    environment:
      HOST: 0.0.0.0
      PORT: "${PORT:-5173}"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    init: true
