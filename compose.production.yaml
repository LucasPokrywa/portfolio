services:
  portfolio:
    build:
      context: .
      target: production
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-5173}:${PORT:-5173}"
    environment:
      HOST: 0.0.0.0
      PORT: "${PORT:-5173}"
      URL_SITE: "${URL_SITE:-localhost}"
    restart: unless-stopped

    networks:
      default:
      proxy:
        aliases:
          - portfolio

networks:
  proxy:
    external: true
    name: ${VPS_NETWORK_NAME:-proxy}