services:
  portfolio:
    build:
      context: .
      target: production
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-5173}:${PORT:-5173}"
    environment:
      HOST: 0.0.0.0
      PORT: "${PORT:-5173}"
    restart: unless-stopped


networks:
  proxy:
    external: true
    name: ${VPS_NETWORK_NAME:-proxy}